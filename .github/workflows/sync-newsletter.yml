name: Sync newsletter from beehiiv

# The archive at /blog is generated from beehiiv, so it goes stale the moment
# an issue is sent unless something pulls it. Nobody should have to remember a
# command after publishing, and the first issue this would have caught was
# scheduled the day the sync was written.
#
# Runs every three hours. beehiiv posts are infrequent, so most runs find
# nothing and exit without a commit.
#
# This workflow deploys itself rather than relying on the commit to trigger
# deploy.yml: a push made with the Actions GITHUB_TOKEN does not start an
# `on: push` workflow (GitHub's recursion guard), so the commit alone would
# never publish. It therefore rebuilds the full deploy artifacts and runs the
# same `wrangler pages deploy` deploy.yml does.
#
# Requires repository secrets: BEEHIIV_API_KEY, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull from beehiiv and rebuild
        id: build
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
        run: |
          if [ -z "$BEEHIIV_API_KEY" ]; then
            echo "BEEHIIV_API_KEY is not set on this repository — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/sync-beehiiv.mjs
          node tools/build-blog.mjs
          node tools/version-assets.mjs
          node tools/build-markdown.mjs
          node tools/build-routes.mjs
          if git diff --quiet; then
            echo "No change — archive is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Changed:"
          git diff --name-only | sed 's|^|  |'
          git add -A
          git commit -m "Sync newsletter archive from beehiiv

          Generated by .github/workflows/sync-newsletter.yml. Scheduled posts
          are held back until their publish date has passed, so anything
          appearing here has already gone out to subscribers."
          git push

      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=shanegring-com --branch=main --commit-dirty=true
