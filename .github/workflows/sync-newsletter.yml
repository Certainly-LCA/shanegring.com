name: Sync newsletter from beehiiv

# The archive at /blog is generated from beehiiv, so it goes stale the moment
# an issue is sent unless something pulls it. Nobody should have to remember a
# command after publishing, and the first issue this would have caught was
# scheduled the day the sync was written.
#
# Runs every three hours. beehiiv posts are infrequent, so most runs find
# nothing and exit without a commit. A run that does find something commits to
# main, which triggers the deploy workflow.
#
# Requires the repository secret BEEHIIV_API_KEY.

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: newsletter-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull posts from beehiiv
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
        run: |
          if [ -z "$BEEHIIV_API_KEY" ]; then
            echo "BEEHIIV_API_KEY is not set on this repository — nothing to do."
            exit 0
          fi
          node tools/sync-beehiiv.mjs

      - name: Rebuild the archive
        run: |
          node tools/build-blog.mjs
          node tools/version-assets.mjs

      # Only commit when the sync actually changed something. Most runs find
      # no new issue and should leave no trace in the history.
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No change — archive is already current."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SUMMARY=$(git diff --name-only | sed 's|^|  |')
          echo "Changed:"
          echo "$SUMMARY"

          git add -A
          git commit -m "Sync newsletter archive from beehiiv

          Generated by .github/workflows/sync-newsletter.yml. Scheduled posts
          are held back until their publish date has passed, so anything
          appearing here has already gone out to subscribers."
          git push
