name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Two commits, not the default one: the IndexNow step below diffs
          # HEAD against its parent to find what changed, and a shallow clone
          # has no parent to diff against.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pages serves HTML fresh but static assets with a four-hour cache, and
      # ignores Cache-Control set in _headers for them. Stamping a content
      # hash onto the asset URLs means fresh HTML can never request a stale
      # stylesheet. Runs here rather than by hand so a CSS edit cannot ship
      # without it. `continue-on-error` keeps a bad stamp from blocking a
      # deploy — the site is still correct without it, just cacheable.
      - name: Version asset URLs
        continue-on-error: true
        run: node tools/version-assets.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=shanegring-com --branch=main --commit-dirty=true

      # Tell Bing which pages just changed, rather than waiting for it to come
      # round again — it last crawled the sitemap three weeks late. Bing feeds
      # ChatGPT's search results, so this is the shortest path from publishing
      # to being quotable. Runs after the deploy so the URLs are live before
      # anything is invited to fetch them, and only submits what the commit
      # actually touched. Never fails the job: IndexNow is a hint, and the
      # sitemap still lists everything for the next ordinary crawl.
      - name: Tell IndexNow what changed
        continue-on-error: true
        run: node tools/indexnow.mjs --from-git
