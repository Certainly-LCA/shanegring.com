name: Sync notes from Ordinal

# The /notes archive and the homepage "Lately" strip are generated from Shane's
# LinkedIn posts, which live in Ordinal. Without a puller they go stale the day
# after each post. This is the notes-side twin of sync-newsletter.yml.
#
# Runs twice a day. Notes go out around midday Eastern, so a 14:00 and 21:00 UTC
# pass catches the day's post and refreshes engagement counts. A run that finds
# no change leaves no commit and does not deploy.
#
# This workflow deploys itself rather than relying on the commit to trigger
# deploy.yml: a push made with the Actions GITHUB_TOKEN does not start an
# `on: push` workflow (GitHub's recursion guard), so the commit alone would
# never publish. It therefore rebuilds the full deploy artifacts and runs the
# same `wrangler pages deploy` deploy.yml does.
#
# Requires repository secrets: ORDINAL_API_KEY, CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: '0 14,21 * * *'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull from Ordinal and rebuild
        id: build
        env:
          ORDINAL_API_KEY: ${{ secrets.ORDINAL_API_KEY }}
        run: |
          if [ -z "$ORDINAL_API_KEY" ]; then
            echo "ORDINAL_API_KEY is not set on this repository — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/sync-ordinal.mjs
          node tools/build-notes.mjs
          node tools/version-assets.mjs
          node tools/build-markdown.mjs
          node tools/build-routes.mjs
          if git diff --quiet; then
            echo "No change — notes are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Changed:"
          git diff --name-only | sed 's|^|  |'
          git add -A
          git commit -m "Sync notes archive from Ordinal

          Generated by .github/workflows/sync-notes.yml from Shane's posted
          LinkedIn posts. Engagement counts are a point-in-time reading."
          git push

      - name: Deploy to Cloudflare Pages
        if: steps.build.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=shanegring-com --branch=main --commit-dirty=true
